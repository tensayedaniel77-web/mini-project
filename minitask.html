<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGPA & CGPA calculater</title>
    <link rel="stylesheet" href="minitask.css">
</head>
<body>
    <!--Right side (Home)-->
    <div class="app">
    <section class="right-panel">
        <div>
            <h1 class="welcome">Welcome, Student!</h1>
             <div class="cards">
            <div class="card">
                <h2>Calculate SGPA</h2>
            </div>

            <div class="card">
                <h2>Calculate CGPA</h2>
            </div>
        </div>
         <div class="history">
            <h2>Recent History</h2>

            <div class="history-box">
                <p><strong>Sem 1 SGPA:</strong> 0.00</p>
                <p><strong>Sem 1 CGPA:</strong> 0.00</p>
                </div>
            </div>
    </section>
     <!-- left SIDE (SGPA + CGPA CALCULATORS) -->
      <!-- SGPA CALCULATOR -->
      <section class="right-panel">
        <div >
            <div class="calculator-box">
            <h2>SGPA Calculator</h2>
            <div>
            <label for="course-name">Course Name</label>
            <input type="text" id="course-name" placeholder="Enter course name">
            </div>
            <div>
                <label for="credits">Credit Number</label>
                <input type="number" id="credits" min="0" value="0">
            </div>
             <div class="form-group">
            <label for="grade">Grade</label>
            <select id="grade">
                <option>A+</option>
                <option>A</option>
                <option>B+</option>
                <option>B</option>
                <option>C+</option>
                <option>C</option>  
                <option>D</option>
                <option>F</option>
            </select>
            </div>
            <div class="actions">
            <button class="btn-secondery">Add Course</button>
            <button class="btn-primary">Calculate</button>
            </div>
             <div class="result-box">
                <p>Your SGPA: <strong>0.00</strong></p>
            </div>
        </div>
    </section>
        <!-- CGPA CALCULATOR -->
         <section class="right-panel">
        <div class="calculator-box">
            <h2>CGPA Calculator</h2>
             <div class="form-group">
            <label for="sem1">Semester 1 SGPA</label>
            <input type="number" step="0.01" max="4">
            </div>  
            <div class="form-group"> 
            <label for="sem2">Semester 2 SGPA</label>
            <input type="number" step="0.01"  max="4">
            </div>
            <button class="btn-primary">Calculate CGPA</button>
            </div>
      </section>
      </div>
      <!--Footer-->
      <footer>
        <p><strong>SGPA & CGPA Calculator</strong></p>
        <P>Designed to help students track their academic progress</P>
        <p>&copy 2026  . Developed by :) </p>
      </footer>

</body>
</html>
